<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test URL e doPost</title>
</head>
<body>

    <h1>Test Verifica URL</h1>
    <p>Guarda l'alert e controlla la console (F12).</p>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7LvVwjzdMOjSNHFM5YNwXmOD7CcoUvvtGlDWGO5ryukf9O8xdlXES_KZCtGp_NASF/exec";

        // 1. Legge il parametro 'codice' dall'URL
        const params = new URLSearchParams(window.location.search);
        const codiceTrovato = params.get("codice");

        // 2. Mostra un alert immediato per confermare che l'URL è stato letto
        if (codiceTrovato) {
            alert("Codice trovato nell'URL: " + codiceTrovato);
        } else {
            alert("Nessun codice trovato nell'URL! (Aggiungi ?codice=123 alla fine dell'indirizzo)");
        }

        // 3. Se il codice esiste, fa la doPost verso Apps Script
        if (codiceTrovato) {
            fetch(URL_APPS_SCRIPT, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    azione: "verifica_codice",
                    codice: codiceTrovato
                })
            })
            .then(response => response.json())
            .then(risultato => {
                console.log("Risposta ricevuta da Apps Script:", risultato);
                alert("Risposta dal server: " + JSON.stringify(risultato));
            })
            .catch(error => {
                console.error("Errore durante la fetch:", error);
            });
        }
    </script>

</body>
</html>
